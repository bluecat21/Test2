<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a84de9"/>
      <stop offset="1" stop-color="#4930f5"/>
    </linearGradient>
    <linearGradient id="bubble" x1=".25" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#dedaff"/>
    </linearGradient>
    <linearGradient id="candy" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ff9cdb"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3011a2" flood-opacity=".3"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- Chat bubble -->
  <path d="M100 35
           C134 35 162 61 162 96
           C162 130 136 156 101 156
           H61 L45 153 Q42 152 44 148
           L53 134 C44 124 39 111 39 96
           C39 61 66 35 100 35Z"
        fill="url(#bubble)" filter="url(#shadow)"/>

  <path d="M100 39
           C132 39 158 64 158 96
           C158 128 134 152 101 152
           H61 L49 149 L57 135
           C48 125 43 112 43 96
           C43 64 68 39 100 39Z"
        fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>

  <!-- Lollipop stick -->
  <path d="M101 102 L101 127"
        fill="none" stroke="#b68df8" stroke-width="7" stroke-linecap="round"/>
  <path d="M99.5 104 L99.5 125"
        fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>

  <!-- Lollipop candy -->
  <circle cx="101" cy="87" r="18" fill="url(#candy)" filter="url(#soft)"/>
  <circle cx="101" cy="87" r="16" fill="url(#candy)"/>
  <path d="M92 86 C93 78 101 73 108 77"
        fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="95" cy="93" r="2" fill="#fff" fill-opacity=".65"/>
</svg>
